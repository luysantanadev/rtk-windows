name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-presence:
    name: test presence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Check filter modules have tests
        shell: pwsh
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          ./scripts/check-test-presence.ps1 -BaseBranch "origin/${{ github.base_ref }}"

  fmt:
    name: fmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        shell: pwsh
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: fmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        shell: pwsh
        run: cargo clippy --all-targets

  test:
    name: test
    needs: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test all
        shell: pwsh
        run: cargo test --all

  security:
    name: Security Scan
    needs: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        shell: pwsh
        run: cargo install cargo-audit
      - name: Cargo Audit (CVE check)
        shell: pwsh
        run: cargo audit
