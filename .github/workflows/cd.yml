name: CD

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════
  # DEVELOP PATH: Pre-release
  # ═══════════════════════════════════════════════

  pre-release:
    if: >-
      github.ref == 'refs/heads/develop'
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version from commits like release please   
        id: tag
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            # No stable release tag yet — bootstrap at v0.0.0 so first release lands on v0.1.0
            LATEST_VERSION="0.0.0"
            echo "No release tag found — bootstrapping at v0.0.0 (first release will be v0.1.0+)"
            COMMITS=$(git log HEAD --format="%s")
          else
            LATEST_VERSION="${LATEST_TAG#v}"
            echo "Latest release: $LATEST_TAG"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s")
          fi

          # ── Analyse conventional commits ──
          HAS_BREAKING=$(echo "$COMMITS" | grep -cE '^[a-z]+(\(.+\))?!:' || true)
          HAS_FEAT=$(echo "$COMMITS"    | grep -cE '^feat(\(.+\))?:'     || true)
          HAS_FIX=$(echo "$COMMITS"     | grep -cE '^fix(\(.+\))?:'      || true)
          echo "Commits since v${LATEST_VERSION} — breaking=$HAS_BREAKING feat=$HAS_FEAT fix=$HAS_FIX"

          # ── Compute next version (matches release-please observed behaviour) ──
          # Pre-1.0 with bump-minor-pre-major: breaking → minor, feat → minor, fix → patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          if [ "$MAJOR" -eq 0 ]; then
            if [ "$HAS_BREAKING" -gt 0 ] || [ "$HAS_FEAT" -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0            # breaking or feat → minor
            else
              PATCH=$((PATCH + 1))                     # fix only → patch
            fi
          else
            if [ "$HAS_BREAKING" -gt 0 ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0   # breaking → major
            elif [ "$HAS_FEAT" -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0             # feat → minor
            else
              PATCH=$((PATCH + 1))                      # fix → patch
            fi
          fi
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="dev-${VERSION}-rc.${{ github.run_number }}"

          echo "Next version: $VERSION (from $LATEST_VERSION)"
          echo "Pre-release tag: $TAG"

          # Safety: fail if this exact tag already exists
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-prerelease:
    name: Build pre-release
    needs: pre-release
    if: needs.pre-release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.pre-release.outputs.tag }}
      prerelease: true
    permissions:
      contents: write
    secrets: inherit

  # ═══════════════════════════════════════════════
  # MAIN PATH: Stable release
  # ═══════════════════════════════════════════════

  stable-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute stable version from commits
        id: tag
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_VERSION="0.0.0"
            echo "No release tag found — bootstrapping at v0.0.0"
            COMMITS=$(git log HEAD --format="%s")
          else
            LATEST_VERSION="${LATEST_TAG#v}"
            echo "Latest release: $LATEST_TAG"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s")
          fi

          HAS_BREAKING=$(echo "$COMMITS" | grep -cE '^[a-z]+(\(.+\))?!:' || true)
          HAS_FEAT=$(echo "$COMMITS"    | grep -cE '^feat(\(.+\))?:'     || true)
          HAS_FIX=$(echo "$COMMITS"     | grep -cE '^fix(\(.+\))?:'      || true)
          echo "Commits since v${LATEST_VERSION} — breaking=$HAS_BREAKING feat=$HAS_FEAT fix=$HAS_FIX"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          if [ "$MAJOR" -eq 0 ]; then
            if [ "$HAS_BREAKING" -gt 0 ] || [ "$HAS_FEAT" -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
          else
            if [ "$HAS_BREAKING" -gt 0 ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [ "$HAS_FEAT" -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
          fi
          TAG="v${MAJOR}.${MINOR}.${PATCH}"

          # Idempotent: skip if tag already exists
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists — skipping"
            echo "tag=" >> $GITHUB_OUTPUT
          else
            echo "Stable tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

  build-release:
    name: Build stable release
    needs: stable-release
    if: needs.stable-release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.stable-release.outputs.tag }}
      prerelease: false
    permissions:
      contents: write
    secrets: inherit
