[package]
name = "rtk-windows"
version = "0.1.0"
edition = "2021"
authors = ["Patrick Szymkowiak"]
description = "RTK Windows Fork - High-performance CLI proxy to minimize LLM token consumption"
license = "MIT"
homepage = "https://www.rtk-ai.app"
repository = "https://github.com/luysantanadev/rtk-windows.git"
readme = "README.md"
keywords = ["cli", "llm", "token", "filter", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
ignore = "0.4"
walkdir = "2"
regex = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
colored = "2"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
chrono = "0.4"
tempfile = "3"
sha2 = "0.10"
flate2 = "1.0"
quick-xml = "0.37"
which = "8"
automod = "1"

[build-dependencies]
toml = "0.8"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
